name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the jobs only check out and test code. Actions are pinned by commit SHA
# (Dependabot keeps the pins and the version comments current).
permissions:
  contents: read

# The container jobs run inside the official Playwright image: Chromium, Firefox, WebKit and every system
# library they need are preinstalled. The previous `npx playwright install --with-deps` step
# apt-installed WebKit/Firefox media dependencies (ffmpeg, gstreamer, flite, …) from the Ubuntu
# mirror on every run and intermittently crawled at ~40 KB/s, stalling the job for 60+ minutes.
# Keep the image tag equal to the locked `playwright` version; scripts/check-playwright-image.mjs
# fails the run with instructions if they drift. `--user 1001` matches the runner's uid so
# Firefox (which refuses to run as root under another user's $HOME) and the workspace mount work.

# A push to a pull request supersedes its previous run; pushes to main always run to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The verification suite runs as parallel shards. scripts/ci-shard.mjs defines what each shard
  # runs and (in the `packages` shard, via `npm run test:checks`) proves that together they run
  # exactly what `npm test` runs locally, plus the release checks, and that this matrix lists every
  # shard. Run serially in one job, the suite took ~37 min; the longest shard takes ~8.
  verify-shard:
    name: "Verify: ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    # A stall guard, not a budget: the longest shard takes ~8 min (~10 on a slow runner); 25 still
    # stops a hung shard well short of the 60+ min stalls noted above.
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [packages, registry, flash-1, flash-2, site-pages, site-motion, release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright image matches the locked playwright version
        run: node scripts/check-playwright-image.mjs

      - name: Build all workspaces (lab, registry, eval, site, next-starter)
        run: npm run build

      - name: Run the ${{ matrix.shard }} shard
        run: node scripts/ci-shard.mjs ${{ matrix.shard }}

      - name: Upload the @frame12/terminal gallery
        if: matrix.shard == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frame12-terminal-gallery
          path: packages/terminal/gallery/review/png/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload dry-run package tarballs and manifest as artifact
        if: matrix.shard == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frame12-package-tarballs
          path: /tmp/frame12-release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  # One status for the whole suite, under the check name the verify job has always had (branch
  # protection and the PR checks list keep working): green only when every shard is green.
  verify:
    name: Build, Lint, Accessibility & Smoke Install
    needs: verify-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every verification shard passed
        env:
          RESULT: ${{ needs.verify-shard.result }}
        run: |
          echo "verify-shard: $RESULT"
          test "$RESULT" = success

  terminal:
    # @frame12/terminal's contract, capability, safety, width, token and boundary suites run on every
    # OS and Node version the package supports. They inject capabilities instead of reading the
    # runner's terminal, so results do not depend on the CI environment.
    name: "@frame12/terminal (${{ matrix.os }}, Node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Keep LF line endings (dist/ and generated files are compared byte for byte)
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Install node-pty for the real-terminal tests (native; kept out of the lockfile)
        working-directory: packages/terminal
        shell: bash
        # node-pty 1.1.0 ships its macOS spawn-helper without the execute bit (posix_spawnp failed).
        run: |
          mkdir -p .pty && cd .pty && echo '{"private":true}' > package.json && npm install --no-audit --no-fund node-pty@1.1.0
          chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper

      - name: Test @frame12/terminal (drift, typecheck, unit, boundary, Ink and real-pty tests)
        env:
          F12_REQUIRE_PTY: '1'
          # The README's Go, Python and Rust emitters must run on ubuntu (its runners ship all three).
          F12_REQUIRE_EMITTERS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: npm test --workspace=@frame12/terminal

  real-install:
    name: Fresh Next.js + shadcn init -d + next build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install repo dependencies
        run: npm ci

      - name: Verify Playwright image matches the locked playwright version
        run: node scripts/check-playwright-image.mjs

      - name: Install into fresh create-next-app (individual sheet+panel, base, & full kit) and verify autoCut + next build
        run: node scripts/real-install.mjs

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint, Accessibility & Smoke Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify workspace file synchronization
        run: npm run sync:check

      - name: Build all workspaces (lab, registry, eval, site, next-starter)
        run: npm run build

      - name: Run full verification & cross-browser suite (unit, a11y, cross-browser, linter, eval, site, next-starter)
        run: npm test

      - name: Run shadcn registry smoke-install verification (single-component & full kit)
        run: node scripts/smoke-install.mjs

  real-install:
    name: Fresh Next.js + shadcn init -d + next build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repo dependencies & Chromium for real-install verification
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install into fresh create-next-app (individual sheet+panel, base, & full kit) and verify autoCut + next build
        run: node scripts/real-install.mjs

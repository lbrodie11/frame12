name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint, Accessibility & Smoke Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify workspace file synchronization
        run: npm run sync:check

      - name: Build all workspaces (registry, eval, site)
        run: npm run build

      - name: Run full verification suite (unit, a11y, linter, eval, site, launch)
        run: npm test

      - name: Run shadcn registry smoke-install verification
        run: node scripts/smoke-install.mjs

  real-install:
    name: Fresh Next.js + shadcn init -d + next build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install into fresh create-next-app with default shadcn init -d and run next build
        run: |
          node -e '
            const http = require("node:http");
            const fs = require("node:fs");
            const path = require("node:path");
            const os = require("node:os");
            const { spawn } = require("node:child_process");

            function runCmd(cmd, args, cwd) {
              return new Promise((resolve, reject) => {
                const child = spawn(cmd, args, { cwd, stdio: "inherit" });
                child.on("error", reject);
                child.on("close", (code) => {
                  if (code === 0) resolve();
                  else reject(new Error(`${cmd} ${args.join(" ")} exited with code ${code}`));
                });
              });
            }

            const repoRoot = process.cwd();
            const pubDir = path.join(repoRoot, "site/public/r");
            const srv = http.createServer((req, res) => {
              const file = path.join(pubDir, path.basename((req.url || "").split("?")[0]));
              if (file.startsWith(pubDir) && fs.existsSync(file)) {
                res.writeHead(200, { "Content-Type": "application/json; charset=utf-8" });
                res.end(fs.readFileSync(file));
              } else {
                res.writeHead(404);
                res.end("Not found");
              }
            });

            srv.listen(0, "127.0.0.1", async () => {
              const port = srv.address().port;
              const tmp = fs.mkdtempSync(path.join(os.tmpdir(), "frame12-next-app-"));
              try {
                await runCmd(
                  "npx",
                  ["--yes", "create-next-app@latest", "app", "--ts", "--tailwind", "--eslint", "--app", "--src-dir", "--import-alias", "@/*", "--use-npm", "--yes"],
                  tmp
                );
                const appDir = path.join(tmp, "app");
                await runCmd("npx", ["--yes", "shadcn@latest", "init", "-d", "--yes"], appDir);
                // Serves site/public/r/frame12.json (identical to https://frame12.dev/r/frame12.json)
                await runCmd(
                  "npx",
                  ["--yes", "shadcn@latest", "add", `http://127.0.0.1:${port}/r/frame12.json`, "--yes", "--overwrite"],
                  appDir
                );
                await runCmd("npx", ["next", "build"], appDir);
              } catch (err) {
                console.error(err);
                process.exitCode = 1;
              } finally {
                srv.close();
                fs.rmSync(tmp, { recursive: true, force: true });
              }
            });
          '
